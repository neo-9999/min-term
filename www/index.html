<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/716429.png" type="image/png">
    <title>StreamHub - Movies & TV Shows</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* 使用了一张深色电影院背景图，并叠加了一层半透明黑色遮罩 */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('https://images.unsplash.com/photo-1574267432553-4b4628081c31?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(0, 0, 0, 0.75);
            padding: 60px 68px 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo-box {
            margin-bottom: 25px;
            text-align: left;
        }
        .logo-box svg {
            fill: #e50914; /* 流媒体经典红 */
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 8px rgba(229,9,20,0.4));
        }
        h2 {
            font-size: 32px;
            font-weight: 600;
            margin: 0 0 12px 0;
            text-align: left;
        }
        p {
            color: #b3b3b3;
            font-size: 15px;
            margin-bottom: 28px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 4px;
            border: none;
            background: #333333;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        input:focus {
            background: #454545;
            box-shadow: 0 0 0 2px #e50914;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #f40612;
        }
        button:disabled {
            background: #b20710;
            cursor: not-allowed;
            opacity: 0.7;
        }
        #msg {
            margin-top: 20px;
            font-size: 14px;
            color: #e87c03; /* 警告色 */
            min-height: 1.2em;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
        </div>
        <h2>Sign In</h2>
        <p>Access your personal movies & TV shows</p>
        <form id="authForm">
            <input type="text" id="u" placeholder="Email or Username" autocomplete="off" required>
            <input type="password" id="p" placeholder="Password" required>
            <button type="submit" id="s">Sign In</button>
        </form>
        <div id="msg"></div>
    </div>

    
    <script>
        const f = document.getElementById('authForm');
        const s = document.getElementById('s');
        const m = document.getElementById('msg');

        f.addEventListener('submit', (e) => {
            e.preventDefault();
            s.disabled = true;
            s.innerText = 'Authenticating...';
            m.innerText = '';

            fetch('/api/v1/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: f.u.value, hash: btoa(f.p.value) })
            })
            .then(res => res.json())
            .then(data => {
                m.innerText = data.message || 'Access denied.';
                s.disabled = false;
                s.innerText = 'Sign In';
            })
            .catch(() => {
                m.innerText = 'Service unavailable. Please contact administrator.';
                s.disabled = false;
                s.innerText = 'Sign In';
            });
        });
    </script>
</body>
</html>
